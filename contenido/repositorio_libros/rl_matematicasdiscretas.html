<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physikós</title>
    <!-- CODEX: añadido para restaurar el estado visual del menu movil antes del primer render -->
    <script src="../../script/menu_estado_inicial.js"></script>
    <!-- CODEX: añadido para cargar estilos base comunes antes del CSS especifico -->
    <link rel="stylesheet" href="../../styles/style.css">
    <!-- CODEX: añadido para cargar el overlay global reutilizable -->
    <link rel="stylesheet" href="../../styles/overlay.css">
    <link rel="stylesheet" href="../../styles/repositoriolibrospdfs.css"> 
    <link rel="stylesheet" href="../../styles/menu_icons.css">
    <link rel="icon" href="../../img/iconHeadW.svg">
</head>

<body>
    <h1 id="top"></h1>
    <div class="container__grid">
        <div class="header" id="header">
            <div class="header_content-namePage">
                <a href="../../index.html">
                    <div class="imgname"></div>
                </a>
                <div id="btn_menu" class="btn-menu" title=""></div>
            </div>
            <div class="topactions">
                <div class="content__DarkMode">
                    <label class="darmode-btn-content" for="click-DarkMode">
                        <i class="btn-sun"></i>
                        <label for="click-DarkMode"></label>
                        <input type="checkbox" id="click-DarkMode">
                        <i class="btn-moon"></i>
                    </label>
                </div>
                <div class="header_content-img"><a href="https://www.uce.edu.ec/" target="_BLANK"><img src="https://aka-cdn.uce.edu.ec/ares/tmp/logo3.png" alt="El servidor ha fallado."></a></div>
            </div>
        </div>

        <div class="menu menu_dsm">
            <nav class="menu_nav">
                <!--<div class="content__search"></div>-->
                <!-- CODEX: modificado para renderizar el menu lateral y marcar Álgebra Lineal desde datos reutilizables -->
                <div class="content__content" data-menu-render data-menu-base="../../" data-menu-current="repositorio-libros" data-menu-submenus="true" data-menu-subcurrent="matematicas-discretas"></div>
                <!--<div class="content__Lenguaje-libros">
                    <span>Lenguaje</span>
                    <label class="lenguaje-btn-content" for="click-lenguaje">
                        <span class="before">EN</span>
                        <input type="checkbox" id="click-lenguaje">
                        <span class="before">ES</span>
                    </label>
                </div>-->
                
            </nav>
        </div>

        <div class="main" id="main-despleglabe">
            <section class="main_s2 books-repository" aria-labelledby="books-repository-title" data-books-category="matematicas_discretas">
                <header class="books-repository__header">
                    <div class="books-repository__heading">
                        <h1 id="books-repository-title" class="books-repository-title">Matemáticas Discretas</h1>
                        <p class="books-repository__description">
                            Explora la colección de libros disponibles para esta categoría.
                        </p>
                    </div>

                    <div class="books-repository__summary" aria-live="polite">
                        <span id="books-counter" class="books-repository__counter">0 libros disponibles</span>
                    </div>
                </header>

                <div class="books-repository__toolbar" aria-label="Herramientas del repositorio de libros">
                    <div class="books-repository__search" id="books-search-region">
                        <label class="books-repository__visually-hidden" for="books-search-input">Buscar libros</label>
                        <input id="books-search-input" class="books-repository__search-input" type="search" placeholder="Buscar libros..." autocomplete="off">
                    </div>
                    <div class="books-repository__view-options" id="books-view-options">
                        <label class="books-repository__sort-label" for="books-sort-select">Ordenar</label>
                        <select id="books-sort-select" class="books-repository__sort-select">
                            <option value="titulo-asc">Título A-Z</option>
                            <option value="titulo-desc">Título Z-A</option>
                            <option value="autor-asc">Autor A-Z</option>
                            <option value="autor-desc">Autor Z-A</option>
                        </select>
                        <div class="books-repository__view-toggle" role="group" aria-label="Vista">
                            <button id="books-view-grid" class="books-repository__view-button is-active" type="button" data-view="grid" aria-pressed="true">Cuadrícula</button>
                            <button id="books-view-list" class="books-repository__view-button" type="button" data-view="list" aria-pressed="false">Lista</button>
                        </div>
                    </div>
                </div>

                <div class="books-repository__categories" id="books-category-tabs" aria-label="Categorías de libros"></div>

                <div class="home-toc-section books-repository__content">
                    <div class="home-toc-container books-repository__grid" id="home-toc-container">
                    </div>
                </div>

                <div class="books-repository__detail-panel" id="book-detail-panel" role="dialog" aria-modal="true" aria-labelledby="book-detail-title" hidden>
                    <div class="books-repository__detail-backdrop" data-book-detail-close></div>
                    <article class="books-repository__detail-card">
                        <button class="books-repository__detail-close" type="button" data-book-detail-close aria-label="Cerrar detalles">Cerrar</button>
                        <div class="books-repository__detail-cover">
                            <img id="book-detail-image" src="../../img/repositoriolibros/default.jpg" alt="">
                        </div>
                        <div class="books-repository__detail-content">
                            <p id="book-detail-category" class="books-repository__detail-category"></p>
                            <h2 id="book-detail-title"></h2>
                            <p id="book-detail-author" class="books-repository__detail-author"></p>
                            <dl class="books-repository__detail-list">
                                <div>
                                    <dt>Categoría</dt>
                                    <dd id="book-detail-category-value"></dd>
                                </div>
                                <div>
                                    <dt>Archivo PDF</dt>
                                    <dd id="book-detail-file"></dd>
                                </div>
                            </dl>
                            <button id="book-detail-open" class="books-repository__detail-open" type="button">Abrir PDF</button>
                        </div>
                    </article>
                </div>
            </section>
        </div>

        <div class="footer">
            <div class="footer-left">
                <a href="#">Licencia</a>
                <a href="https://github.com/Fercharicastillo/chari">| Git Hub</a> 
                <a href="../../contenido/versiones.html">| Versiones</a>
            </div>
            <div class="footer-right"></div>
        </div>
        <div class="indicador_container">
            <div class="indicador_scroll"></div>
        </div>
        <div id="btn-top" class="ocultar" title="Subir">
            <i class="btn-up"></i>
        </div>   
    </div>
<!-- CODEX: añadido para construir URLs publicas de PDF.js Viewer en repositorios -->
<script src="../../script/helpers/rutas_pdf.js" defer></script>
<script src="../../script/repositorio_libros_js/libros_data.js" defer></script>
<script src="../../script/repositorio_libros_js/archivos_pdfs.js" defer></script>
<script src="../../script/ui/overlay.js" defer></script>
<!-- CODEX: añadido para cargar datos y renderizador reutilizable del menu lateral -->
<script src="../../script/menu_datos.js" defer></script>
<script src="../../script/menu_render.js" defer></script>
<script src="../../script/menu.js" defer></script>
<script src="../../script/flecha.js" defer></script>
<script src="../../script/versiones/physikos_version.js" defer></script>
</body>
</html>
