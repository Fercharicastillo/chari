<!doctype html>
<html lang="es" data-menu-inicial-cerrado>
  <head>
    <!-- CODEX: añadido para documentar la plantilla estándar de futuros simuladores de Physikós -->

    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Simulador educativo de movimiento rectilíneo uniformemente variado de Physikós."
    />
    <title>Physikós | Simulador de MRUV</title>

    <script src="../../script/menu_estado_inicial.js"></script>
    <link rel="stylesheet" href="../../styles/style.css" />
    <link rel="stylesheet" href="../../styles/overlay.css" />
    <link rel="stylesheet" href="../../styles/menu_icons.css" />
    <link
      rel="stylesheet"
      href="../../styles/simuladores/react-integration.css"
    />
    <link rel="icon" href="../../img/iconHeadW.svg" />
  </head>

  <body>
    <div class="container__grid">
      <header class="header" id="header">
        <div class="header_content-namePage">
          <a href="../../index.html" aria-label="Ir al inicio de Physikós">
            <div class="imgname"></div>
          </a>
          <div id="btn_menu" class="btn-menu" title=""></div>
        </div>

        <div class="topactions">
          <div class="content__DarkMode">
            <label class="darmode-btn-content" for="click-DarkMode">
              <i class="btn-sun"></i>
              <label for="click-DarkMode"></label>
              <input type="checkbox" id="click-DarkMode" />
              <i class="btn-moon"></i>
            </label>
          </div>
          <div class="header_content-img">
            <a href="https://www.uce.edu.ec/" target="_BLANK">
              <img
                src="https://aka-cdn.uce.edu.ec/ares/tmp/logo3.png"
                alt="Universidad Central del Ecuador"
              />
            </a>
          </div>
        </div>
      </header>

      <aside class="menu menu_dsm">
        <nav class="menu_nav" aria-label="Menú principal">
          <div
            class="content__content"
            data-menu-render
            data-menu-base="../../"
            data-menu-current="simuladores"
            data-menu-submenus="true"
            data-menu-subcurrent="sim-mruv"
          ></div>
        </nav>
      </aside>
      <div
        class="loader-page"
        role="status"
        aria-label="Cargando simulador de MRUV"
      ></div>
      <main class="main" id="main-despleglabe">
        <section
          class="simulator-page simulator-page--react"
          data-simulador="sim-mruv"
          aria-label="Simulador de MRUV"
        >
          <div
            data-physikos-simulador
            data-physikos-simulador-mruv
            data-url-clase="../repositorio_planes/rp_mecanica_newtoniana.html"
            data-guia-id="guia-laboratorio-mruv"
            data-url-guia-pdf="../../apps/simulador-mruv/dist-embed/guias-laboratorio/mruv-guia-laboratorio.pdf"
            data-url-visor-pdf="../../visor_pdfs/web/viewer.html"
          >
            <noscript>
              Para utilizar el simulador de MRUV debes habilitar JavaScript.
            </noscript>
          </div>
        </section>
      </main>

      <footer class="footer">
        <div class="footer-left">
          <a href="#">Licencia</a>
          <a href="https://github.com/Fercharicastillo/chari">| Git Hub</a>
          <a href="../../contenido/versiones.html">| Versiones</a>
        </div>
        <div class="footer-right"></div>
      </footer>

      <div class="indicador_container">
        <div class="indicador_scroll"></div>
      </div>

      <div id="btn-top" class="ocultar" title="Subir">
        <i class="btn-up"></i>
      </div>
    </div>

    <script src="../../script/ui/overlay.js" defer></script>
    <script src="../../script/menu_datos.js" defer></script>
    <script src="../../script/menu_render.js" defer></script>
    <script src="../../script/menu.js" defer></script>
    <script src="../../script/flecha.js" defer></script>
    <script src="../../script/versiones/physikos_version.js" defer></script>
    <script
      type="module"
      src="../../apps/simulador-mruv/dist-embed/simulador-mruv.js"
    ></script>
  </body>
</html>
