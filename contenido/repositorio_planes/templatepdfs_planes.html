<script defer type="text/javascript">
                // CODEX: modificado para marcar el subitem activo del visor PDF sin borrar el encabezado activo del menu
                document.addEventListener("DOMContentLoaded", function() {
                    var pdfSrc = sessionStorage.getItem('pdfSrc');
                    if (pdfSrc) {
                    document.getElementById('pdfViewer').src = pdfSrc;
                    }

                    var origen = sessionStorage.getItem("origen");
                    var subitemsPorOrigen = {
                        mecanica: "mecanica-newtoniana",
                        calculo: "calculo-diferencial"
                    };

                    document.querySelectorAll("[data-menu-subitem-id]").forEach(function(item) {
                    item.classList.remove("current");
                    });

                    var subitemActivo = subitemsPorOrigen[origen];
                    var menu = document.querySelector('[data-menu-subitem-id="' + subitemActivo + '"]');

                    if (menu) {
                        menu.classList.add("current");
                    }

                });
</script>
